<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一起出遊 🏕️</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    body { background: linear-gradient(160deg,#f0fdf4 0%,#ecfdf5 100%); min-height:100vh; }
    .spin  { animation: spin  1s linear   infinite; }
    .slide { animation: slide .25s ease; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes slide { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-thumb { background:#86efac; border-radius:2px; }
    body { overflow-x: hidden; }
    @media (max-width: 640px) {
      /* 避免 iOS 聚焦 16px 以下輸入框時自動放大，造成版面跳動。 */
      input, select { font-size: 16px !important; }
    }
  
    /* 隱藏原生時間選擇器的時鐘 icon */
    input[type="time"]::-webkit-calendar-picker-indicator {
      display: none;
      -webkit-appearance: none;
    }
    input[type="time"] {
      cursor: pointer;
    }

    /* 修正 iOS 原生時間選擇器的文字對齊問題 */
    input[type="time"]::-webkit-date-and-time-value {
      text-align: left;
    }
</style>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
<div id="app" class="max-w-lg mx-auto px-4 pb-28 min-h-screen"></div>
<script>
// ── utils ──────────────────────────────────────────────────────────
const $e = id => document.getElementById(id);
const fmt = n => '$' + (+n || 0).toLocaleString('zh-TW', {maximumFractionDigits:2});
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[ch]));

// 正式部署前只需由維護者填入一次。一般使用者不需要、也不應看見 API 設定。
// Web App URL 不是祕密；請搭配後端的輸入驗證與使用量監控。
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbygKTfIk0pqval3Df8Y2Xj_HhJMpYCiu_FvZzyEQWEdXSoaEYhOoV3Ga-_yLqwSZlzk/exec';
const DEV_SETTINGS = new URLSearchParams(location.search).get('setup') === '1';
const COLORS = ['from-green-400 to-emerald-500','from-blue-400 to-cyan-500',
  'from-purple-400 to-violet-500','from-amber-400 to-orange-500','from-pink-400 to-rose-500'];
const getColor = name => COLORS[(name||'?').charCodeAt(0) % COLORS.length];

function toast(msg, type) {
  const c = {ok:'bg-green-600',err:'bg-red-600',info:'bg-gray-800'};
  const el = document.createElement('div');
  el.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 '+(c[type]||c.info)+' text-white px-5 py-2.5 rounded-full text-sm z-50 shadow-xl';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity=0; setTimeout(()=>el.remove(),300); }, 2500);
}

// ── state ──────────────────────────────────────────────────────────
const S = {
  page:  'home',
  apiUrl: DEV_SETTINGS ? localStorage.getItem('agy_trip_api') || DEFAULT_API_URL : DEFAULT_API_URL,
  actId:  new URLSearchParams(location.search).get('id'),
  act: null, user: null, tab: 'schedule', busy: false, syncing: 0,
  expandedItem: null, autoRefreshTimer: null, scheduleDateDraft: null,
  draft: { name:'', members:[], items:[] }
};

// ── api ────────────────────────────────────────────────────────────
async function apiGet(params) {
  if (!S.apiUrl) throw new Error('請先設定 API URL');
  const url = new URL(S.apiUrl);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k,v));
  const r = await fetch(url.toString());
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}
async function apiPost(body) {
  if (!S.apiUrl) throw new Error('請先設定 API URL');
  // 不指定自訂 Header，瀏覽器會以 text/plain 發送，屬於 CORS simple request；
  // 也避免將行程 JSON 塞進 GET URL 而碰到網址長度上限。
  const r = await fetch(S.apiUrl, { method: 'POST', body: JSON.stringify(body) });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}

async function loadAct(id, isSilent = false) {
  if (!isSilent) { S.busy = true; render(); }
  try {
    const d = await apiGet({ action: 'getActivity', id });
    const newAct = d.activity;
    
    // BUG FIX 4: 如果正在寫入資料，或剛寫完不到 15 秒（避免讀到延遲的舊資料），暫停背景更新
    if (S.syncing > 0 || (S.lastWriteTime && Date.now() - S.lastWriteTime < 15000)) {
      if (!isSilent) { S.busy = false; render(); }
      return;
    }

    // Check if anything changed to avoid UI flashing
    if (S.act) {
      const oldStr = JSON.stringify({ items: S.act.items, schedule: S.act.schedule });
      const newStr = JSON.stringify({ items: newAct.items, schedule: newAct.schedule });
      if (oldStr === newStr) {
        if (!isSilent) { S.busy = false; render(); }
        return; // No changes, DO NOT render if silent
      }
    }
    
    S.act = newAct;
    S.busy = false;
    render();
  } catch (e) { 
    if(!isSilent) toast('❌ ' + e.message, 'err'); 
    S.busy = false;
    if(!isSilent) render();
  }
}

// Start auto refresh
function startAutoRefresh() {
  if (S.autoRefreshTimer) clearInterval(S.autoRefreshTimer);
  S.autoRefreshTimer = setInterval(() => {
    if (S.actId && S.page === 'activity') {
      // 暫停更新：如果使用者正在輸入，不要拉取資料以免覆蓋正在打字的內容
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT')) return;
      
      loadAct(S.actId, true);
    }
  }, 30000);
}
startAutoRefresh();


async function saveSchedule() {
  S.syncing = (S.syncing || 0) + 1; S.lastWriteTime = Date.now(); // BUG FIX 4: 行程儲存時鎖定同步，避免背景刷新覆蓋
  try {
    await apiPost({ action: 'updateSchedule', activityId: S.actId, schedule: S.act.schedule });
  } catch (e) {
    // BUG FIX 2: 印出詳細錯誤訊息，並在 404 時不覆蓋畫面
    toast('行程儲存失敗: ' + e.message, 'err');
  } finally {
    S.syncing--; S.lastWriteTime = Date.now();
  }
}

async function updateItemRemote(itemId, name, claimers, payer, amount, sharers, shouldRender = true) {
  const item = S.act?.items?.find(i => String(i.id) === String(itemId));
  if (item) { 
    if(name) item.name=name;
    item.claimers=claimers; item.payer=payer; item.amount=+amount||0; 
    item.sharers=sharers; 
    // 文字欄／金額欄在手機上輸入時不可重建整張卡片，否則焦點與鍵盤會被中斷。
    if (shouldRender) render();
  }
  S.syncing = (S.syncing || 0) + 1; S.lastWriteTime = Date.now(); 
  let failed = false;
  try { 
    await apiPost({action:'updateItem',activityId:S.actId,itemId,name:name||item.name,claimers,payer,amount:+amount||0, sharers: sharers||null}); 
  }
  catch(e) { toast('❌ 儲存失敗：'+e.message,'err'); failed = true; }
  finally {
    S.syncing--; S.lastWriteTime = Date.now();
    if (failed) await loadAct(S.actId);
  }
}

// ── settlement ─────────────────────────────────────────────────────
function calcSettlement() {
  if (!S.act) return null;
  const {members,items} = S.act;
  const paidCents = {}; const balCents = {};
  members.forEach(m => { paidCents[m]=0; balCents[m]=0; });
  let totalCents = 0;
  
  items.forEach(it => {
    if (it.payer && it.amount > 0) {
      const amountCents = Math.round(Number(it.amount) * 100);
      paidCents[it.payer] = (paidCents[it.payer]||0) + amountCents;
      balCents[it.payer] = (balCents[it.payer]||0) + amountCents;
      totalCents += amountCents;

      const sh = it.sharers || members;
      if (sh.length > 0) {
        // 以「分」運算，無法整除的餘額依分攤人目前順序各加一分，
        // 確保建議匯款加總永遠等於原始金額。
        const base = Math.floor(amountCents / sh.length);
        const remainder = amountCents % sh.length;
        sh.forEach((m, index) => { balCents[m] = (balCents[m]||0) - base - (index < remainder ? 1 : 0); });
      }
    }
  });
  const creditors = members.filter(m=>balCents[m]>0).map(m=>({name:m,amt:balCents[m]})).sort((a,b)=>b.amt-a.amt);
  const debtors   = members.filter(m=>balCents[m]<0).map(m=>({name:m,amt:-balCents[m]})).sort((a,b)=>b.amt-a.amt);
  const txns = []; let ci=0,di=0;
  while (ci<creditors.length && di<debtors.length) {
    const amt = Math.min(creditors[ci].amt, debtors[di].amt);
    if (amt>0) txns.push({from:debtors[di].name, to:creditors[ci].name, amt:amt/100});
    creditors[ci].amt -= amt; debtors[di].amt -= amt;
    if (creditors[ci].amt === 0) ci++;
    if (debtors[di].amt === 0) di++;
  }
  const paid = Object.fromEntries(members.map(m => [m, paidCents[m] / 100]));
  const bal = Object.fromEntries(members.map(m => [m, balCents[m] / 100]));
  const cost = Object.fromEntries(members.map(m => [m, (paidCents[m] - balCents[m]) / 100]));
  return {total: totalCents / 100, paid, bal, cost, txns};
}

// ── render ─────────────────────────────────────────────────────────
function render() {
  const app = $e('app'); if (!app) return;
  if (S.busy && !S.act) { app.innerHTML = renderLoading(); return; }
  const pages = {home:renderHome, setup:renderSetup, create:renderCreate, activity:renderActivity};
  app.innerHTML = (pages[S.page] || renderHome)();
  bind();
}

function renderLoading() {
  return '<div class="flex flex-col items-center justify-center min-h-screen text-center"><div class="text-6xl mb-4 animate-bounce">🏕️</div><p class="text-gray-400">載入中...</p></div>';
}

function renderSchedule() {
  if (!S.act.schedule) S.act.schedule = [];
  const entries = S.act.schedule
    .map((s, idx) => ({ s, idx }))
    .sort((a, b) => {
      const dateCompare = (a.s.date || '9999-99-99').localeCompare(b.s.date || '9999-99-99');
      // 同一時間保留原本輸入順序，避免不同格式（09:30／0930）被字串排序打亂。
      return dateCompare || scheduleTimeValue(a.s.time) - scheduleTimeValue(b.s.time) || a.idx - b.idx;
    });
  const groups = entries.reduce((result, entry) => {
    const date = entry.s.date || '';
    (result[date] ||= []).push(entry);
    return result;
  }, {});
  const undatedCount = groups['']?.length || 0;
  const timelineHtml = Object.entries(groups).map(([date, group]) => `
    <section class="mb-5">
      <div class="-mx-1 mb-2 px-1 py-2 flex items-center gap-2">

function formatScheduleDate(date) {
  const parsed = new Date(date + 'T00:00:00');
  return parsed.toLocaleDateString('zh-TW', { month:'long', day:'numeric', weekday:'short' });
}

function localDateValue() {
  const now = new Date();
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function nextScheduleDate() {
  const dates = S.act.schedule.map(s => s.date).filter(Boolean).sort();
  if (!dates.length) return localDateValue();
  const [year, month, day] = dates[dates.length - 1].split('-').map(Number);
  const next = new Date(year, month - 1, day + 1);
  const local = new Date(next.getTime() - next.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function scheduleTimeValue(time) {
  const value = String(time || '').trim();
  let hour, minute;
  const colon = value.match(/^(\d{1,2}):(\d{2})$/);
  const compact = value.match(/^\d{3,4}$/);
  const hourOnly = value.match(/^\d{1,2}$/);
  if (colon) {
    hour = Number(colon[1]); minute = Number(colon[2]);
  } else if (compact) {
    hour = Number(value.slice(0, -2)); minute = Number(value.slice(-2));
  } else if (hourOnly) {
    hour = Number(value); minute = 0;
  } else {
    return Number.MAX_SAFE_INTEGER;
  }
  return hour >= 0 && hour < 24 && minute >= 0 && minute < 60
    ? hour * 60 + minute : Number.MAX_SAFE_INTEGER;
}

// ── event binding ──────────────────────────────────────────────────
function bind() {
  const on = (id,ev,fn) => { const el=$e(id); if(el) el.addEventListener(ev,fn); };

  // home
  on('btn-create','click',() => { if(!S.apiUrl){S.page='setup';render();return;} S.draft={name:'',members:[],items:[]}; S.page='create'; render(); });
  on('btn-join','click', doJoin);
  on('join-input','keydown', e => { if(e.key==='Enter') doJoin(); });
  on('btn-go-setup','click', () => { S.page='setup'; render(); });
  on('btn-settings','click', () => { S.page='setup'; render(); });

  // setup
  on('btn-back','click', goHome);
  on('btn-save-api','click', () => {
    const url = $e('api-input')?.value?.trim();
    if (!url) { toast('請輸入 API URL','err'); return; }
    S.apiUrl = url; localStorage.setItem('agy_trip_api', url);
    toast('✅ 設定已儲存','ok'); goHome();
  });
  on('btn-test','click', async () => {
    const url = $e('api-input')?.value?.trim(), res = $e('test-result');
    if (!url || !res) return;
    res.innerHTML = '<p class="text-sm text-gray-400">🔄 測試中...</p>';
    try {
      const u = new URL(url); u.searchParams.set('action','ping');
      const d = await (await fetch(u.toString())).json();
      res.innerHTML = d.status==='ok'
        ? '<p class="text-sm text-green-600 font-medium">✅ 連線成功！</p>'
        : `<p class="text-sm text-red-500">❌ ${d.error||'未知錯誤'}</p>`;
    } catch(e) { res.innerHTML = `<p class="text-sm text-red-500">❌ ${e.message}</p>`; }
  });

  // create
  bindCreate();

  // activity header
  on('btn-share','click', () => {
    const url = new URL(location.href); url.search = '?id='+S.actId;
    navigator.clipboard?.writeText(url.toString()); toast('✅ 分享連結已複製！','ok');
  });
  on('user-sel','change', e => { S.user=e.target.value; if(S.user&&S.actId) localStorage.setItem('agy_user_'+S.actId,S.user); render(); });
  
  // Schedule bindings
  on('tab-schedule', 'click', () => { S.tab='schedule'; render(); });
  const addScheduleOnDate = async date => {
    if (!date) { toast('請先選擇日期', 'err'); return; }
    if(!S.act.schedule) S.act.schedule=[];
    S.act.schedule.push({date, time:'', location:'', title:'', locationUrl:''});
    S.scheduleDateDraft = null;
    render();
    await saveSchedule();
  };
  on('new-schedule-date', 'change', e => { S.scheduleDateDraft = e.target.value; });
  on('btn-add-sch', 'click', () => addScheduleOnDate($e('new-schedule-date')?.value));
  document.querySelectorAll('.sch-add-on-date').forEach(btn => {
    btn.addEventListener('click', e => addScheduleOnDate(e.currentTarget.dataset.date));
  });
  document.querySelectorAll('.sch-assign-undated').forEach(input => {
    input.addEventListener('change', async e => {
      const date = e.currentTarget.value;
      if (!date) return;
      S.act.schedule.forEach(s => { if (!s.date) s.date = date; });
      S.scheduleDateDraft = null;
      await saveSchedule();
      render();
    });
  });
  
  
  // 點擊時間輸入框直接觸發原生選擇器
  document.querySelectorAll('.sch-time').forEach(el => {
    el.addEventListener('click', e => {
      try { e.target.showPicker(); } catch(err) {}
    });
  });
document.querySelectorAll('.sch-time, .sch-location, .sch-title, .sch-location-url').forEach(el => {
    // 記住進入時的值
    el.addEventListener('focus', e => { e.target.dataset.orig = e.target.value; });
    const saveField = async e => {
      let val = e.target.value.trim();
      if (val === (e.target.dataset.orig || '').trim()) return; // 沒改就不要打 API
      
      const idx = e.target.dataset.idx;
      const field = e.target.classList.contains('sch-time') ? 'time'
        : e.target.classList.contains('sch-location') ? 'location'
        : e.target.classList.contains('sch-location-url') ? 'locationUrl' : 'title';
      S.act.schedule[idx][field] = val;
      e.target.dataset.orig = val;
      await saveSchedule();
      // 取消立刻重繪，避免輸入到一半 DOM 被重建導致焦點遺失或瀏覽器 Autofill 錯亂
      // 排序會在下次背景更新或手動重整時自動生效。
    };
    el.addEventListener('blur', saveField);
    el.addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });
  });
  
  document.querySelectorAll('.sch-del').forEach(el => {
    el.addEventListener('click', async e => {
      const idx = e.target.dataset.idx;
      S.act.schedule.splice(idx, 1);
      render();
      await saveSchedule();
    });
  });

  on('tab-items','click',  () => { S.tab='items';      render(); });
    on('btn-copy-settle', 'click', () => {
    if (!S.act) return;
    const r = calcSettlement();
    if (!r || r.total === 0) return;
    let text = `【${S.act.name}】結算明細 💰\n\n`;
    text += `活動總支出：${fmt(r.total)}\n`;
    text += `\n💸 建議付款方式：\n`;
    if (r.txns.length === 0) {
      text += `費用已均攤，不需要額外匯款！\n`;
    } else {
      r.txns.forEach(t => {
        text += `${t.from} ➡️ ${t.to}：${fmt(t.amt)}\n`;
      });
    }
    text += `\n💡 個人明細請到 ${S.act.name} 確認\n`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => toast('✅ 結算文字已複製', 'ok'));
    } else {
        toast('❌ 瀏覽器不支援複製，請手動選取', 'err');
    }
  });
  on('tab-settle','click', () => { S.tab='settlement'; render(); });
  on('btn-refresh','click',() => { if(S.actId) loadAct(S.actId); });

  // add item in activity
  const doAddItem = async () => {
    const inp=$e('new-item'), name=inp?.value?.trim(); if(!name) return; inp.value='';
    const tmpId='tmp_'+Date.now(); 
    S.act.items.push({id:tmpId,name,claimers:[],payer:'',amount:0, sharers:null}); render();
    
    S.syncing = (S.syncing || 0) + 1; S.lastWriteTime = Date.now(); // BUG FIX 4
    try { 
      const res = await apiPost({action:'addItem',activityId:S.actId,name}); 
      // BUG FIX 4: 直接更新 ID，不要 loadAct，避免 Google Sheet 資料庫延遲導致剛新增的項目消失
      const item = S.act.items.find(i=>i.id===tmpId);
      if (item) item.id = res.itemId;
      render();
    }
    catch(e) { toast('❌ '+e.message,'err'); S.act.items=S.act.items.filter(i=>i.id!==tmpId); render(); }
    finally { S.syncing--; S.lastWriteTime = Date.now(); }
  };
  on('btn-add-item-a','click', doAddItem);
  on('new-item','keydown', e => { if(e.key==='Enter') doAddItem(); });

  // row toggle expand/collapse
  
  const itemList = $e('item-list-container');
  if (itemList && window.Sortable) {
    Sortable.create(itemList, {
      animation: 150,
      handle: '.drag-handle',
      ghostClass: 'opacity-50',
      onEnd: async (evt) => {
        if (evt.oldIndex === evt.newIndex) return;
        const item = S.act.items.splice(evt.oldIndex, 1)[0];
        S.act.items.splice(evt.newIndex, 0, item);
        S.syncing = (S.syncing || 0) + 1; S.lastWriteTime = Date.now();
        try {
          await apiPost({ action: 'reorderItems', activityId: S.actId, itemIds: S.act.items.map(i => i.id) });
        } catch (e) { toast('排序儲存失敗: ' + e.message, 'err'); }
        finally { S.syncing--; S.lastWriteTime = Date.now(); }
      }
    });
  }

  document.querySelectorAll('.row-toggle').forEach(el => {
    el.addEventListener('click', e => {
      // 手機上的 tap/click 事件會冒泡；互動控制項不應觸發卡片收合。
      if (e.target.closest('input, select, button, label, .drag-handle')) return;
      const id = e.currentTarget.dataset.id;
      S.expandedItem = S.expandedItem === id ? null : id;
      render();
    });
  });

  // member toggle chips (anyone can assign anyone)
  document.querySelectorAll('.member-toggle').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const itemId = e.currentTarget.dataset.item;
      const member = e.currentTarget.dataset.member;
      const item = S.act?.items?.find(i => String(i.id) === String(itemId));
      if (!item) return;
      const nc = item.claimers.includes(member)
        ? item.claimers.filter(c => c !== member)
        : [...item.claimers, member];
      const nEl=document.querySelector(`.item-name-inp[data-id="${itemId}"]`); await updateItemRemote(itemId, nEl?nEl.value:item.name, nc, item.payer, item.amount, item.sharers);
    });
  });

    // sharer toggle chips
  document.querySelectorAll('.sharer-toggle').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const itemId = e.currentTarget.dataset.item;
      const member = e.currentTarget.dataset.member;
      const item = S.act?.items?.find(i => String(i.id) === String(itemId));
      if (!item) return;
      let sh = item.sharers || [...S.act.members];
      if (sh.includes(member)) sh = sh.filter(c => c !== member);
      else sh = [...sh, member];
      if (sh.length === 0) { toast('至少需要一位分攤人', 'err'); return; }
      const nEl=document.querySelector(`.item-name-inp[data-id="${itemId}"]`); await updateItemRemote(itemId, nEl?nEl.value:item.name, item.claimers, item.payer, item.amount, sh);
    });
  });

  // delete item
  document.querySelectorAll('.item-del').forEach(btn => {
    btn.addEventListener('click', async e => {
      const id = e.currentTarget.dataset.id;
      if (!confirm('確定要刪除此品項嗎？')) return;
      
      // Optimistic update
      S.act.items = S.act.items.filter(i => String(i.id) !== String(id));
      render();
      
      S.syncing = (S.syncing || 0) + 1; S.lastWriteTime = Date.now(); // BUG FIX 5: 鎖定自動更新，避免刪除後舊資料又閃現
      try {
        await apiPost({ action: 'deleteItem', activityId: S.actId, itemId: id });
        toast('✅ 已刪除', 'ok');
      } catch (err) {
        toast('刪除失敗: ' + err.message, 'err');
        loadAct(S.actId); // Revert on failure
      } finally {
        S.syncing--; S.lastWriteTime = Date.now();
      }
    });
  });


  // payer select — auto-save
  document.querySelectorAll('.payer-sel').forEach(sel => {
    sel.addEventListener('change', async e => {
      const id=e.currentTarget.dataset.id, card=e.currentTarget.closest('[data-item-id]');
      const amtEl=card?.querySelector('.amount-inp'), item=S.act?.items?.find(i=>String(i.id)===String(id));
      if(!item) return;
      const nEl=card?.querySelector(".item-name-inp"); await updateItemRemote(id, nEl?nEl.value:item.name, item.claimers, e.currentTarget.value, amtEl?+amtEl.value:item.amount, item.sharers, false);
    });
  });

  // item name input — save on blur
  document.querySelectorAll('.item-name-inp').forEach(inp => {
    inp.addEventListener('blur', async e => {
      const id=e.currentTarget.dataset.id, card=e.currentTarget.closest('[data-item-id]');
      const payerEl=card?.querySelector('.payer-sel'), amtEl=card?.querySelector('.amount-inp');
      const item=S.act?.items?.find(i=>String(i.id)===String(id));
      if(!item) return;
      const val = e.currentTarget.value.trim();
      if (val === item.name || !val) return;
      await updateItemRemote(id, val, item.claimers, payerEl?payerEl.value:item.payer, amtEl?+amtEl.value:item.amount, item.sharers, false);
    });
    inp.addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });
  });

  // amount input — save on blur
  document.querySelectorAll('.amount-inp').forEach(inp => {
    inp.addEventListener('blur', async e => {
      const id=e.currentTarget.dataset.id, card=e.currentTarget.closest('[data-item-id]');
      const payerEl=card?.querySelector('.payer-sel'), item=S.act?.items?.find(i=>String(i.id)===String(id));
      if(!item) return;
      const nEl=card?.querySelector(".item-name-inp"); await updateItemRemote(id, nEl?nEl.value:item.name, item.claimers, payerEl?payerEl.value:item.payer, +e.currentTarget.value||0, item.sharers, false);
    });
    inp.addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });
  });


}

function bindCreate() {
  const saveName = () => { if($e('act-name')) S.draft.name = $e('act-name').value; };
  const addMember = () => {
    saveName(); const inp=$e('member-input'), n=inp?.value?.trim();
    if(!n||S.draft.members.includes(n)){inp?.focus();return;}
    S.draft.members.push(n); inp.value='';
    const w=$e('members-wrap'); if(w){w.innerHTML=S.draft.members.map(memberChip).join('');bindChips();} inp.focus();
  };
  const addItemC = () => {
    saveName(); const inp=$e('item-input'), n=inp?.value?.trim();
    if(!n||S.draft.items.includes(n)){inp?.focus();return;}
    S.draft.items.push(n); inp.value='';
    const w=$e('items-wrap'); if(w){w.innerHTML=S.draft.items.map(itemRow).join('');bindChips();} inp.focus();
  };
  const on=(id,ev,fn)=>{const el=$e(id);if(el)el.addEventListener(ev,fn);};
  on('btn-add-member','click', addMember);
  on('create-id','input', e => { e.target.value = e.target.value.toUpperCase(); });
  on('member-input','keydown', e => { if(e.key==='Enter'){e.preventDefault();addMember();} });
  on('btn-add-item-c','click', addItemC);
  on('item-input','keydown', e => { if(e.key==='Enter'){e.preventDefault();addItemC();} });
  on('btn-submit','click', async () => {
    const name=$e('act-name')?.value?.trim()||S.draft.name, members=S.draft.members, items=S.draft.items;
    const customId=$e('create-id')?.value?.trim().toUpperCase()||'';
    if(!name){toast('❌ 請輸入活動名稱','err');return;}
    if(!members.length){toast('❌ 請新增至少一位成員','err');return;}
    if(customId && !/^[A-Z0-9]{3,24}$/.test(customId)) { toast('❌ 活動代碼須為 3～24 位英文字母或數字','err'); return; }
    const btn=$e('btn-submit'); if(btn){btn.textContent='建立中...';btn.disabled=true;}
    try {
      const d=await apiPost({action:'createActivity',name,members,items,customId}), id=d.activityId;
      S.actId=id; S.user=members[0]; localStorage.setItem('agy_user_'+id, members[0]);
      const url=new URL(location.href); url.searchParams.set('id',id); history.pushState({},'',url.toString());
      S.page='activity'; S.tab='items'; await loadAct(id);
    } catch(e) { toast('❌ '+e.message,'err'); if(btn){btn.textContent='🚀 建立活動';btn.disabled=false;} }
  });
  bindChips();
}

function bindChips() {
  document.querySelectorAll('.rm-member').forEach(btn => {
    btn.addEventListener('click', e => { S.draft.members.splice(+e.currentTarget.dataset.i,1); const w=$e('members-wrap'); if(w){w.innerHTML=S.draft.members.map(memberChip).join('');bindChips();} });
  });
  document.querySelectorAll('.rm-item').forEach(btn => {
    btn.addEventListener('click', e => { S.draft.items.splice(+e.currentTarget.dataset.i,1); const w=$e('items-wrap'); if(w){w.innerHTML=S.draft.items.map(itemRow).join('');bindChips();} });
  });
}

function goHome() { S.page='home'; S.act=null; S.actId=null; history.pushState({},'',location.pathname); render(); }

function doJoin() {
  const id=$e('join-input')?.value?.trim();
  if(!id){toast('請輸入活動代碼','err');return;}
  if(!S.apiUrl){toast('請先設定 API URL','err');S.page='setup';render();return;}
  S.actId=id; S.user=localStorage.getItem('agy_user_'+id)||null; S.act=null;
  const url=new URL(location.href); url.searchParams.set('id',id); history.pushState({},'',url.toString());
  S.page='activity'; S.tab='items'; loadAct(id);
}

// ── init ───────────────────────────────────────────────────────────
(function init() {
  if (S.actId) {
    S.user = localStorage.getItem('agy_user_'+S.actId);
    S.page = 'activity';
    if (!S.apiUrl) { S.page='setup'; render(); return; }
    render(); loadAct(S.actId);
  } else { render(); }
})();
</script>
</body>
</html>
